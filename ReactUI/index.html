<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" sizes="180x180" />
    <link rel="apple-touch-icon" href="/pwa/icon-source.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Diba Gallery" />
    <meta name="application-name" content="Diba Gallery" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Diba Gallery — contemporary furniture, rugs, and home décor. Design-led collections and interior inspiration."
    />
    <meta name="theme-color" content="#9a7448" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <title>Diba Gallery — Contemporary Furniture &amp; Interiors</title>
    <!--ssr-head-->
    <script>
      try {
        var raw = localStorage.getItem('westelm-settings');
        var parsed = raw ? JSON.parse(raw) : null;
        var locale = parsed && parsed.state && parsed.state.locale ? parsed.state.locale : 'en';
        var theme =
          parsed && parsed.state && parsed.state.theme ? parsed.state.theme : 'system';
        var dark =
          theme === 'dark' ||
          (theme !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.lang = locale === 'fa' ? 'fa' : 'en';
        document.documentElement.dir = locale === 'fa' ? 'rtl' : 'ltr';
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.locale = locale;
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        var font = document.createElement('link');
        font.rel = 'stylesheet';
        font.id = 'locale-font-stylesheet';
        font.href =
          locale === 'fa'
            ? 'https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css'
            : 'https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap';
        document.head.appendChild(font);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <!--ssr-data-->
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
